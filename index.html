<title>Corporate Copilot — Roadmap</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
    background: #f5f5f7;
    color: #0a0a0f;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .gate {
    background: #ffffff;
    border: 1px solid #e5e5ea;
    border-radius: 20px;
    padding: 48px 40px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
  }

  .gate .eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #ff0032;
    margin-bottom: 12px;
  }

  .gate h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 8px;
  }

  .gate .hint {
    font-size: 14px;
    color: #6e6e76;
    margin-bottom: 32px;
  }

  .gate label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #6e6e76;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .gate input[type="password"] {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid #d5d5da;
    border-radius: 10px;
    font-size: 16px;
    background: #fafafc;
    color: #0a0a0f;
    transition: border-color 0.15s, background 0.15s;
    font-family: inherit;
  }

  .gate input[type="password"]:focus {
    outline: none;
    border-color: #ff0032;
    background: #ffffff;
  }

  .gate button {
    width: 100%;
    margin-top: 16px;
    padding: 14px;
    background: #0a0a0f;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    font-family: inherit;
  }

  .gate button:hover { opacity: 0.9; }
  .gate button:active { transform: scale(0.99); }
  .gate button:disabled { opacity: 0.5; cursor: progress; }

  .error {
    margin-top: 14px;
    font-size: 13px;
    color: #ff0032;
    min-height: 18px;
  }

  .footer {
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid #f0f0f3;
    font-size: 11px;
    color: #9a9aa0;
    text-align: center;
    letter-spacing: 0.5px;
  }
</style>
</head>

  <h1>Roadmap</h1>

    <div class="error" id="error"></div>
  </form>

  <div class="footer">Внутренний документ</div>
</div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function deriveKey(password, salt) {
  const enc = new TextEncoder();
  const material = await crypto.subtle.importKey(
    'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' },
    material,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
}

async function unlock(password) {
  const salt = b64(DATA.salt);
  const iv = b64(DATA.iv);
  const ct = b64(DATA.ct);
  const key = await deriveKey(password, salt);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
  return new TextDecoder().decode(plain);
}

const form = document.getElementById('pw-form');
const input = document.getElementById('pw');
const btn = document.getElementById('submit');
const err = document.getElementById('error');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Открываем…';
  try {
    const html = await unlock(input.value);
    document.open();
    document.write(html);
    document.close();
  } catch {
    err.textContent = 'Неверный пароль';
    btn.disabled = false;
    btn.textContent = 'Открыть';
    input.select();
  }
});
</script>
